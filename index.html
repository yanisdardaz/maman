<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Agenda de Maman</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        /* Décorations animées */
        .bubble {
            position: absolute;
            border-radius: 50%;
            opacity: 0.25;
            filter: blur(1px);
            animation: float 12s infinite alternate ease-in-out;
            pointer-events: none;
        }

        .bubble.b1 {
            width: 140px;
            height: 140px;
            background: #ffb6c1;
            top: -40px;
            right: -40px;
            animation-delay: 0s;
        }

        .bubble.b2 {
            width: 100px;
            height: 100px;
            background: #ffd1ff;
            bottom: -30px;
            left: -20px;
            animation-delay: 2s;
        }

        .bubble.b3 {
            width: 80px;
            height: 80px;
            background: #ffe4b5;
            top: 40%;
            left: -30px;
            animation-delay: 4s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0) scale(1);
            }

            100% {
                transform: translateY(-20px) translateX(20px) scale(1.1);
            }
        }

        header {
            padding: 20px 28px 16px;
            background: linear-gradient(120deg, #ff9a9e, #fecfef);
            color: #fff;
            position: relative;
            z-index: 1;
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 4px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 20px 24px 24px;
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
            gap: 20px;
        }

        @media (max-width: 720px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #fff7fb;
            border-radius: 18px;
            padding: 16px 18px 18px;
            border: 1px solid #ffd6f5;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top left, rgba(255, 192, 203, 0.25), transparent 60%);
            opacity: 0;
            animation: cardGlow 4s infinite alternate;
            pointer-events: none;
        }

        @keyframes cardGlow {
            0% {
                opacity: 0.1;
            }

            100% {
                opacity: 0.35;
            }
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2 span {
            font-size: 20px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .form-row input[type="text"],
        .form-row input[type="time"] {
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid #ffc4e3;
            font-size: 14px;
            flex: 1;
            min-width: 120px;
            outline: none;
            transition: box-shadow 0.2s, border-color 0.2s, transform 0.1s;
            background: #fff;
        }

        .form-row input[type="text"]:focus,
        .form-row input[type="time"]:focus {
            border-color: #ff7fbf;
            box-shadow: 0 0 0 2px rgba(255, 127, 191, 0.25);
            transform: translateY(-1px);
        }

        textarea {
            width: 100%;
            min-height: 70px;
            resize: vertical;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid #ffc4e3;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
            background: #fff;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        textarea:focus {
            border-color: #ff7fbf;
            box-shadow: 0 0 0 2px rgba(255, 127, 191, 0.25);
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(120deg, #ff7eb3, #ff758c);
            color: #fff;
            box-shadow: 0 8px 18px rgba(255, 117, 140, 0.4);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
        }

        .btn:hover {
            filter: brightness(1.05);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 4px 10px rgba(255, 117, 140, 0.35);
        }

        .tasks {
            max-height: 340px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .task {
            background: #fff;
            border-radius: 12px;
            padding: 10px 10px 8px;
            margin-bottom: 8px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: center;
            border: 1px solid #ffe0f3;
            transition: transform 0.1s, box-shadow 0.1s, background 0.2s, border-color 0.2s;
            animation: taskAppear 0.25s ease-out;
        }

        @keyframes taskAppear {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .task:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .task.done {
            background: #f0ffe9;
            border-color: #b7f0a1;
            opacity: 0.9;
        }

        .task input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #ff7eb3;
        }

        .task-main {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .task-title {
            font-size: 14px;
            font-weight: 600;
        }

        .task-time {
            font-size: 12px;
            color: #777;
        }

        .task-memo {
            font-size: 12px;
            color: #555;
        }

        .task-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chip {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 999px;
            background: #ffe4f3;
            color: #b3005a;
            text-align: center;
            white-space: nowrap;
        }

        .btn-small {
            border: none;
            background: transparent;
            color: #ff4b6e;
            font-size: 11px;
            cursor: pointer;
            padding: 2px 4px;
            text-decoration: underline;
        }

        .btn-small:hover {
            color: #d8004a;
        }

        .memo-card textarea {
            min-height: 140px;
        }

        .memo-info {
            font-size: 11px;
            color: #777;
            margin-top: 4px;
        }

        .footer {
            padding: 6px 20px 10px;
            font-size: 11px;
            color: #666;
            text-align: right;
            background: #fffdfd;
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>

        <header>
            <h1>Agenda de Maman 💖</h1>
            <p>Note ce que tu as à faire, à quelle heure, et coche quand c’est fait.</p>
        </header>

        <div class="content">
            <!-- Colonne gauche : tâches -->
            <div class="card">
                <h2><span>📝</span> Tâches de la journée</h2>

                <div class="form-row" style="margin-top: 6px;">
                    <input id="taskTitle" type="text" placeholder="Ex : Aller chez le médecin" />
                    <input id="taskTime" type="time" />
                </div>
                <textarea id="taskMemo"
                    placeholder="Petit mémo (adresse, numéro, ce qu’il ne faut pas oublier…)"></textarea>
                <button class="btn" id="addTaskBtn">
                    <span>➕</span> Ajouter la tâche
                </button>

                <div style="margin-top: 12px; font-size: 12px; color: #777;">
                    Tu peux cocher quand c’est fait, ou supprimer si tu t’es trompée.
                </div>

                <div class="tasks" id="tasksList"></div>
            </div>

            <!-- Colonne droite : mémo général -->
            <div class="card memo-card">
                <h2><span>📒</span> Mémo général</h2>
                <textarea id="globalMemo"
                    placeholder="Ici tu peux écrire ce que tu veux : idées, courses, numéros importants, pensées…"></textarea>
                <div class="memo-info">
                    Ce mémo est enregistré automatiquement dans ton navigateur.
                </div>
            </div>
        </div>

        <div class="footer">
            Fait avec beaucoup d’amour 💕
        </div>
    </div>

    <script>
        const taskTitleInput = document.getElementById("taskTitle");
        const taskTimeInput = document.getElementById("taskTime");
        const taskMemoInput = document.getElementById("taskMemo");
        const addTaskBtn = document.getElementById("addTaskBtn");
        const tasksList = document.getElementById("tasksList");
        const globalMemo = document.getElementById("globalMemo");

        const STORAGE_KEY_TASKS = "agenda_maman_tasks";
        const STORAGE_KEY_MEMO = "agenda_maman_global_memo";

        function loadTasks() {
            const saved = localStorage.getItem(STORAGE_KEY_TASKS);
            if (!saved) return [];
            try {
                return JSON.parse(saved);
            } catch {
                return [];
            }
        }

        function saveTasks(tasks) {
            localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(tasks));
        }

        function loadMemo() {
            const saved = localStorage.getItem(STORAGE_KEY_MEMO);
            if (saved !== null) {
                globalMemo.value = saved;
            }
        }

        function saveMemo() {
            localStorage.setItem(STORAGE_KEY_MEMO, globalMemo.value);
        }

        let tasks = loadTasks();
        renderTasks();

        loadMemo();

        globalMemo.addEventListener("input", () => {
            saveMemo();
        });

        addTaskBtn.addEventListener("click", () => {
            const title = taskTitleInput.value.trim();
            const time = taskTimeInput.value;
            const memo = taskMemoInput.value.trim();

            if (!title) {
                alert("Écris au moins un titre pour la tâche 😊");
                return;
            }

            const newTask = {
                id: Date.now(),
                title,
                time,
                memo,
                done: false,
            };

            tasks.unshift(newTask);
            saveTasks(tasks);
            renderTasks();

            taskTitleInput.value = "";
            taskTimeInput.value = "";
            taskMemoInput.value = "";
            taskTitleInput.focus();
        });

        function toggleTaskDone(id) {
            tasks = tasks.map((t) =>
                t.id === id ? { ...t, done: !t.done } : t
            );
            saveTasks(tasks);
            renderTasks();
        }

        function deleteTask(id) {
            if (!confirm("Supprimer cette tâche ?")) return;
            tasks = tasks.filter((t) => t.id !== id);
            saveTasks(tasks);
            renderTasks();
        }

        function renderTasks() {
            tasksList.innerHTML = "";
            if (tasks.length === 0) {
                const empty = document.createElement("div");
                empty.style.fontSize = "12px";
                empty.style.color = "#777";
                empty.style.marginTop = "8px";
                empty.textContent = "Aucune tâche pour l’instant. Ajoute ce que tu veux faire aujourd’hui.";
                tasksList.appendChild(empty);
                return;
            }

            tasks.forEach((task) => {
                const taskEl = document.createElement("div");
                taskEl.className = "task" + (task.done ? " done" : "");

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = task.done;
                checkbox.addEventListener("change", () => toggleTaskDone(task.id));

                const main = document.createElement("div");
                main.className = "task-main";

                const titleEl = document.createElement("div");
                titleEl.className = "task-title";
                titleEl.textContent = task.title;

                const timeEl = document.createElement("div");
                timeEl.className = "task-time";
                timeEl.textContent = task.time ? "À " + task.time : "Sans horaire précis";

                const memoEl = document.createElement("div");
                memoEl.className = "task-memo";
                memoEl.textContent = task.memo;

                main.appendChild(titleEl);
                main.appendChild(timeEl);
                if (task.memo) main.appendChild(memoEl);

                const actions = document.createElement("div");
                actions.className = "task-actions";

                const chip = document.createElement("div");
                chip.className = "chip";
                chip.textContent = task.done ? "Terminé ✅" : "À faire";

                const delBtn = document.createElement("button");
                delBtn.className = "btn-small";
                delBtn.textContent = "Supprimer";
                delBtn.addEventListener("click", () => deleteTask(task.id));

                actions.appendChild(chip);
                actions.appendChild(delBtn);

                taskEl.appendChild(checkbox);
                taskEl.appendChild(main);
                taskEl.appendChild(actions);

                tasksList.appendChild(taskEl);
            });
        }
    </script>
</body>

</html>
